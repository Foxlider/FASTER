name: "Code Analysis"

on:
  push: # The master branch must be analyzed on a new commit
    branches: [ master ]
    tags-ignore:
      - '*'
  pull_request:
    # Any PR on master must be analyzed
    branches: [ master ]
  workflow_dispatch: # CodeQL can be triggered manually

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  analyzeQL:
    name: Analyze with CodeQL
    runs-on: [windows-latest]

    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # required to check out the repository
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: ${{ matrix.language }}

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{env.DOTNET_VERSION}}

    - name: Restore Solution
      run: dotnet restore ./FASTER.sln

    - name: Build Solution
      run: dotnet build ./FASTER.sln --configuration Debug

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2


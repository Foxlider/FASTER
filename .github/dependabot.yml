# .github/dependabot.yml
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "feature/Update-1.9"
    schedule:
      interval: "monthly"
      day: "friday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-minor-patch:
        update-types:
          - "patch"
          - "minor"

  # NuGet packages
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "feature/Update-1.9"
    schedule:
      interval: "monthly"
      day: "friday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore(nuget)"
    groups:
      nuget-minor-patch:
        update-types:
          - "patch"
          - "minor"

  # BytexDigital.Steam submodule
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    target-branch: "feature/Update-1.9"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "git-submodule"
    commit-message:
      prefix: "chore(submodule)"
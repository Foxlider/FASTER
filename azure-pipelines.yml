# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- master

pr:
- master
- feature/Update-1.9

pool:
  vmImage: 'windows-2022'

variables:
  buildConfiguration: 'Release'

steps:
- checkout: self
  submodules: recursive
  displayName: 'Checkout (with submodules)'

- task: UseDotNet@2
  displayName: 'Install .NET SDK from global.json'
  inputs:
    packageType: 'sdk'
    useGlobalJson: true

- task: DotNetCoreCLI@2
  displayName: 'Dotnet Restore'
  inputs:
    command: 'restore'
    projects: 'FASTER.sln'
    feedsToUse: 'select'

- task: SonarCloudPrepare@4
  inputs:
    SonarCloud: 'SonarCloud'
    organization: 'foxlicorp'
    scannerMode: 'dotnet'
    projectKey: 'FASTER_App'
    projectName: 'FASTER_App'
    projectVersion: '$(Build.BuildNumber)'
    extraProperties: |
      sonar.cs.vscoveragexml.reportsPaths=$(Agent.TempDirectory)\coverage.xml

- script: dotnet build --configuration $(buildConfiguration) --no-restore
  displayName: 'Dotnet Build $(buildConfiguration)'

- script: dotnet tool restore
  displayName: 'Restore local .NET tools'

- script: dotnet tool run dotnet-coverage collect "dotnet test FASTERTests/FASTERTests.csproj --configuration $(buildConfiguration) --no-restore --no-build --filter \"TestCategory!=Network\"" -f xml -o "$(Agent.TempDirectory)\coverage.xml"
  displayName: 'Dotnet Test (with coverage)'

- task: SonarCloudAnalyze@4

- task: SonarCloudPublish@4
  displayName: 'Publish SonarCloud Quality Gate result'
  inputs:
    pollingTimeoutSec: '300'

- task: DotNetCoreCLI@2
  displayName: 'Dotnet Publish $(buildConfiguration) x64'
  inputs:
    command: publish
    publishWebProjects: False
    projects: 'FASTER/FASTER.csproj'
    arguments: '--configuration $(BuildConfiguration) -r win-x64 --self-contained true --output $(Build.ArtifactStagingDirectory)\Release_x64'
    zipAfterPublish: True

- task: PublishPipelineArtifact@1
  displayName: 'Publish artifacts'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)'
    artifact: 'FASTER_$(Build.SourceBranchName)_build'
    publishLocation: 'pipeline'